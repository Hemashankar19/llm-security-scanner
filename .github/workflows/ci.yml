name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      # The scanner runs fully offline (mock model), so CI needs no API key.
      - name: Run tests
        run: python -m pytest -q

      - name: Judge calibration must pass (precision & recall >= 80%)
        run: python calibrate.py

      - name: Smoke-test the scan pipeline (chatbot + agent)
        # --no-fail makes the scan exit 0 normally (findings are expected here),
        # while a real crash still raises and fails the step. We then assert the
        # agent scan actually found the planted vulnerabilities.
        run: |
          python cli.py --mock --no-fail --json chatbot.json
          python cli.py --mock --no-fail --target agent --json agent.json
          test -s chatbot.json
          test -s agent.json
          python -c "import json; assert json.load(open('agent.json'))['findings_count'] > 0"
